<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังค้นหาสูตรอาหาร... | มีอะไรในครัว? (What's in My Kitchen)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/data.js"></script>
</head>
<body style="background-color: var(--bg-cream); min-height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div class="text-center p-5 bg-white rounded-4 shadow-sm border" style="max-width: 480px; width: 90%;">
        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem; color: var(--primary-color) !important;" role="status">
            <span class="visually-hidden">กำลังค้นหา...</span>
        </div>
        <h3 class="h5 fw-bold text-dark mb-2">กำลังค้นหาสูตรอาหาร...</h3>
        <p class="text-muted small mb-0" id="searchStatusText">ระบบกำลังค้นหาวัตถุดิบและจับคู่สูตรอาหารให้คุณ</p>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const urlParams = new URLSearchParams(window.location.search);
        const query = (urlParams.get('ingredient') || '').trim().toLowerCase();

        if (!query) {
            window.location.replace('ingredients.html');
            return;
        }

        const ingredients = KitchenData.getIngredients();
        const matched = ingredients.filter(ing => (ing.name || '').toLowerCase().includes(query));

        if (matched.length > 0) {
            const ids = matched.map(m => m.id);
            window.location.replace('find_recipes.html?ingredients=' + ids.join(','));
        } else {
            // หากไม่พบวัตถุดิบ ให้ลองค้นหาจากชื่อสูตรอาหาร
            const recipes = KitchenData.getRecipes();
            const matchedRecipe = recipes.find(r => (r.title || '').toLowerCase().includes(query));
            if (matchedRecipe) {
                window.location.replace('recipe_detail.html?id=' + matchedRecipe.id);
            } else {
                window.location.replace('ingredients.html');
            }
        }
    });
    </script>
</body>
</html>
