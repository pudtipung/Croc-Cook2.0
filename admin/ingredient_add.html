<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มวัตถุดิบใหม่ | ระบบผู้ดูแลระบบ (Croc Cook)</title>
    
    <!-- Google Fonts (Prompt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
    body {
        background-color: var(--bg-cream);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .admin-navbar {
        background-color: #ffffff;
        border-bottom: 1.5px solid var(--border-subtle);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        padding: 0.85rem 0;
    }
    .content-box {
        background-color: #ffffff;
        border: 1.5px solid var(--border-subtle);
        border-radius: 20px;
        padding: 2.25rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }
    </style>
</head>
<body>

    <!-- Admin Navigation Bar -->
    <nav class="admin-navbar sticky-top">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <a href="/admin/index.html" class="text-decoration-none d-flex align-items-center gap-2">
                    <span class="brand-icon" style="background-color: var(--primary-light); color: var(--primary-color); width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 1.3rem;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </span>
                    <div>
                        <span class="fw-bold fs-5 text-dark">มีอะไรในครัว?</span>
                        <span class="badge bg-danger rounded-pill ms-1" style="font-size: 0.7rem;">Admin</span>
                    </div>
                </a>

                <div class="d-none d-md-flex align-items-center gap-2">
                    <a href="/admin/index.html" class="btn btn-sm btn-light rounded-pill px-3 py-2 text-dark">
                        <i class="bi bi-speedometer2 me-1"></i> แดชบอร์ด
                    </a>
                    <a href="/admin/recipes.html" class="btn btn-sm btn-light rounded-pill px-3 py-2 text-dark">
                        <i class="bi bi-journal-bookmark me-1"></i> จัดการสูตรอาหาร
                    </a>
                    <a href="/admin/ingredients.html" class="btn btn-sm btn-light border rounded-pill px-3 py-2 fw-semibold text-primary" style="background-color: var(--primary-light);">
                        <i class="bi bi-basket2 me-1"></i> จัดการวัตถุดิบ
                    </a>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <a href="/admin/ingredients.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-2">
                        <i class="bi bi-arrow-left me-1"></i> กลับหน้ารายการ
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-4 py-md-5 flex-grow-1">
        <div class="container" style="max-width: 600px;">
            <div class="mb-4">
                <h1 class="h3 fw-bold text-dark mb-1">เพิ่มวัตถุดิบใหม่</h1>
                <p class="text-muted small mb-0">กรอกชื่อวัตถุดิบและจัดกลุ่มให้ถูกต้อง</p>
            </div>

            <div class="content-box">
                <form id="addIngredientForm">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">ชื่อวัตถุดิบ <span class="text-danger">*</span></label>
                        <input type="text" id="ingName" class="form-control" placeholder="เช่น สันนอกหมู, มะนาว" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">กลุ่มวัตถุดิบ <span class="text-danger">*</span></label>
                        <select id="ingGroup" class="form-select" required>
                            <option value="เนื้อสัตว์">เนื้อสัตว์</option>
                            <option value="ไข่และแป้ง">ไข่และแป้ง</option>
                            <option value="ผักและสมุนไพร">ผักและสมุนไพร</option>
                            <option value="เครื่องปรุงรส">เครื่องปรุงรส</option>
                            <option value="ทั่วไป">ทั่วไป</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">ประเภทวัตถุดิบ <span class="text-danger">*</span></label>
                        <select id="ingType" class="form-select" required>
                            <option value="main">วัตถุดิบหลัก (Main)</option>
                            <option value="seasoning">เครื่องปรุงรส (Seasoning)</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="/admin/ingredients.html" class="btn btn-outline-secondary rounded-pill px-4">ยกเลิก</a>
                        <button type="submit" class="btn btn-kitchen-primary rounded-pill px-4">
                            <i class="bi bi-check-circle me-1"></i> บันทึกวัตถุดิบ
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/data.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const isLoggedIn = localStorage.getItem('admin_logged_in') === 'true' || sessionStorage.getItem('admin_logged_in') === 'true';
        if (!isLoggedIn) {
            window.location.replace('/admin/login.html');
            return;
        }

        document.getElementById('addIngredientForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('ingName').value.trim();
            const category_group = document.getElementById('ingGroup').value;
            const type = document.getElementById('ingType').value;

            const ings = KitchenData.getIngredients();
            const nextId = ings.length > 0 ? Math.max(...ings.map(i => i.id)) + 1 : 1;

            ings.push({
                id: nextId,
                name,
                category_group,
                type
            });

            localStorage.setItem('kitchen_ingredients', JSON.stringify(ings));
            alert('เพิ่มวัตถุดิบเรียบร้อยแล้ว!');
            window.location.href = '/admin/ingredients.html';
        });
    });
    </script>
</body>
</html>
