<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขสูตรอาหาร | ระบบผู้ดูแลระบบ (Croc Cook)</title>
    
    <!-- Google Fonts (Prompt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
    body {
        background-color: var(--bg-cream);
        min-height: 100vh;
        display: flex;
        flex-direction: column;

    </style>
</head>
<body>

    <!-- Admin Navigation Bar -->
    <nav class="admin-navbar sticky-top">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <a href="/admin/index.html" class="text-decoration-none d-flex align-items-center gap-2">
                    <span class="brand-icon" style="background-color: var(--primary-light); color: var(--primary-color); width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 1.3rem;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </span>
                    <div>
                        <span class="fw-bold fs-5 text-dark">มีอะไรในครัว?</span>
                        <span class="badge bg-danger rounded-pill ms-1" style="font-size: 0.7rem;">Admin</span>
                    </div>
                </a>

                <div class="d-none d-md-flex align-items-center gap-2">
                    <a href="/admin/index.html" class="btn btn-sm btn-light rounded-pill px-3 py-2 text-dark">
                        <i class="bi bi-speedometer2 me-1"></i> แดชบอร์ด
                    </a>
                    <a href="/admin/recipes.html" class="btn btn-sm btn-light border rounded-pill px-3 py-2 fw-semibold text-primary" style="background-color: var(--primary-light);">
                        <i class="bi bi-journal-bookmark me-1"></i> จัดการสูตรอาหาร
                    </a>
                    <a href="/admin/ingredients.html" class="btn btn-sm btn-light rounded-pill px-3 py-2 text-dark">
                        <i class="bi bi-basket2 me-1"></i> จัดการวัตถุดิบ
                    </a>
                </div>

                <div class="d-flex align-items-center gap-2">

                        <i class="bi bi-arrow-left me-1"></i> กลับหน้ารายการ

    <main class="py-4 py-md-5 flex-grow-1">
        <div class="container" style="max-width: 900px;">
            <div class="mb-4">
                <h1 class="h3 fw-bold text-dark mb-1">แก้ไขสูตรอาหาร</h1>
                <p class="text-muted small mb-0">ปรับปรุงข้อมูลสูตรอาหาร วัตถุดิบ และวิธีทำ</p>
            </div>

            <div class="content-box">
                <form id="editRecipeForm">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold">ชื่อสูตรอาหาร <span class="text-danger">*</span></label>
                            <input type="text" id="recipeTitle" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">หมวดหมู่ <span class="text-danger">*</span></label>
                            <select id="recipeCategory" class="form-select" required>
                                <!-- Populated by JS -->
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">คำอธิบายโดยย่อ</label>
                            <input type="text" id="recipeDesc" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">เวลาปรุง (นาที) <span class="text-danger">*</span></label>
                            <input type="number" id="recipeCookingTime" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">จำนวนที่เสิร์ฟ (จาน) <span class="text-danger">*</span></label>
                            <input type="number" id="recipeServings" class="form-control" min="1" required>
                        </div>

                        <!-- ส่วนจัดการรูปภาพสูตรอาหาร -->
                        <div class="col-12">
                            <label class="form-label small fw-semibold">
                                <i class="bi bi-image me-1 text-primary"></i> รูปภาพสูตรอาหาร (เลือกไฟล์หรือใส่ URL ได้)
                            </label>
                            <div class="card p-3 border rounded-3 bg-light" style="border: 1px dashed var(--border-subtle) !important;">
                                <div class="row g-3 align-items-center">
                                    <div class="col-sm-4 col-md-3">
                                        <div id="imagePreviewBox" class="position-relative rounded-3 border overflow-hidden d-flex align-items-center justify-content-center bg-white shadow-xs" style="height: 145px; cursor: pointer;" title="คลิกเพื่อเลือกไฟล์รูปภาพ">
                                            <img id="imagePreview" src="" alt="ตัวอย่างรูปภาพ" class="w-100 h-100 object-fit-cover" style="display: none;">
                                            <div id="imagePlaceholder" class="text-center text-muted p-2">
                                                <i class="bi bi-cloud-arrow-up fs-1 d-block opacity-50 mb-1 text-primary"></i>
                                                <span class="small fw-semibold d-block" style="font-size: 0.78rem;">คลิกเพื่ออัปโหลด</span>
                                                <span class="text-secondary" style="font-size: 0.7rem;">หรือลากไฟล์มาวาง</span>
                                            </div>
                                            <button type="button" id="removeImageBtn" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 rounded-circle p-0 shadow-sm d-flex align-items-center justify-content-center" style="display: none; width: 26px; height: 26px;" title="ลบรูปภาพ">
                                                <i class="bi bi-x fs-6"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-sm-8 col-md-9">
                                        <div class="d-flex flex-column gap-2">
                                            <div>
                                                <label class="form-label small text-dark mb-1">
                                                    <i class="bi bi-phone me-1 text-primary"></i> <strong>1. เลือกไฟล์จากเครื่อง/มือถือ</strong> (ย่อขนาดอัตโนมัติ)
                                                </label>
                                                <input type="file" id="recipeImageFileInput" class="form-control form-control-sm" accept="image/*">
                                            </div>
                                            <div class="d-flex align-items-center gap-2 text-muted small my-1">
                                                <hr class="flex-grow-1 m-0">
                                                <span>หรือ</span>
                                                <hr class="flex-grow-1 m-0">
                                            </div>
                                            <div>
                                                <div class="d-flex justify-content-between align-items-center mb-1">
                                                    <label class="form-label small text-dark mb-0">
                                                        <i class="bi bi-link-45deg me-1 text-primary"></i> <strong>2. ใส่ลิงก์ URL รูปภาพ</strong>
                                                    </label>
                                                    <button type="button" id="useSampleImageBtn" class="btn btn-xs btn-outline-primary rounded-pill py-0 px-2" style="font-size: 0.75rem;">
                                                        <i class="bi bi-stars me-1"></i>ทดลองใส่ภาพตัวอย่าง
                                                    </button>
                                                </div>
                                                <input type="url" id="recipeImageUrlInput" class="form-control form-control-sm" placeholder="https://images.unsplash.com/... หรือ URL รูปภาพจากเน็ต">
                                            </div>
                                            <input type="hidden" id="recipeImageData">
                                            <div id="imageStatusText" class="small" style="font-size: 0.78rem; min-height: 18px;">
                                                <span class="text-muted">* รองรับภาพจากเครื่อง (JPG/PNG) หรือภาพจากเว็บ</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">ขั้นตอนและวิธีทำอาหาร <span class="text-danger">*</span></label>
                            <textarea id="recipeInstructions" class="form-control" rows="5" required></textarea>
                        </div>

                        <div class="col-12">
                            <hr class="my-3">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="h6 fw-bold mb-0">วัตถุดิบในสูตรอาหาร</h5>
                                <span class="badge bg-light text-muted border">เลือกวัตถุดิบที่ใช้</span>
                            </div>
                            <div class="row g-2" id="ingredientsSelectContainer" style="max-height: 250px; overflow-y: auto; border: 1px solid var(--border-subtle); padding: 1rem; border-radius: 12px; background-color: #faf8f5;">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                            <a href="/admin/recipes.html" class="btn btn-outline-secondary rounded-pill px-4">ยกเลิก</a>
                            <button type="submit" class="btn btn-kitchen-primary rounded-pill px-4">
                                <i class="bi bi-check-circle me-1"></i> บันทึกการแก้ไข
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/data.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const isLoggedIn = localStorage.getItem('admin_logged_in') === 'true' || sessionStorage.getItem('admin_logged_in') === 'true';
        if (!isLoggedIn) {
            window.location.replace('/admin/login.html');
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const recipeId = parseInt(urlParams.get('id'));

        if (!recipeId) {
            alert('ไม่พบรหัสสูตรอาหาร');
            window.location.href = '/admin/recipes.html';
            return;
        }

        const recipe = KitchenData.getRecipeById(recipeId);
        if (!recipe) {
            alert('ไม่พบข้อมูลสูตรอาหารนี้');
            window.location.href = '/admin/recipes.html';
            return;
        }

        const categories = KitchenData.getCategories();
        const catSelect = document.getElementById('recipeCategory');
        categories.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            if (c.id === recipe.category_id) opt.selected = true;
            catSelect.appendChild(opt);
        });

        document.getElementById('recipeTitle').value = recipe.title;
        document.getElementById('recipeDesc').value = recipe.description || '';
        document.getElementById('recipeCookingTime').value = recipe.cooking_time;
        document.getElementById('recipeServings').value = recipe.servings;
        document.getElementById('recipeInstructions').value = recipe.instructions;

        // จัดการรูปภาพสูตรอาหาร
        const fileInput = document.getElementById('recipeImageFileInput');
        const urlInput = document.getElementById('recipeImageUrlInput');
        const dataInput = document.getElementById('recipeImageData');
        const imgPreview = document.getElementById('imagePreview');
        const imgPlaceholder = document.getElementById('imagePlaceholder');
        const removeImgBtn = document.getElementById('removeImageBtn');
        const previewBox = document.getElementById('imagePreviewBox');
        const statusText = document.getElementById('imageStatusText');
        const sampleBtn = document.getElementById('useSampleImageBtn');

        function setStatus(msg, type = 'muted') {
            const colors = {
                muted: 'text-muted',
                info: 'text-primary',
                success: 'text-success fw-semibold',
                danger: 'text-danger fw-semibold'
            };
            statusText.innerHTML = `<span class="${colors[type] || 'text-muted'}">${msg}</span>`;
        }

        function showPreview(src) {
            if (src && src.trim()) {
                imgPreview.src = src;
                imgPreview.style.display = 'block';
                imgPlaceholder.style.display = 'none';
                removeImgBtn.style.display = 'flex';
            } else {
                imgPreview.src = '';
                imgPreview.style.display = 'none';
                imgPlaceholder.style.display = 'block';
                removeImgBtn.style.display = 'none';
            }
        }

        function compressImage(file, maxWidth = 800, maxHeight = 600, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => reject(new Error('ไม่สามารถโหลดไฟล์รูปภาพได้'));
                };
                reader.onerror = () => reject(new Error('ไม่สามารถอ่านไฟล์ได้'));
            });
        }

        async function handleImageFile(file) {
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('กรุณาเลือกไฟล์ที่เป็นรูปภาพ เช่น JPG, PNG หรือ WebP');
                return;
            }
            setStatus('<i class="bi bi-arrow-repeat spin me-1"></i>กำลังประมวลผลและย่อขนาดภาพ...', 'info');
            try {
                const compressed = await compressImage(file);
                dataInput.value = compressed;
                urlInput.value = '';
                showPreview(compressed);
                setStatus('<i class="bi bi-check-circle-fill me-1"></i>โหลดรูปภาพจากอุปกรณ์สำเร็จ พร้อมบันทึก', 'success');
            } catch (err) {
                setStatus('<i class="bi bi-exclamation-triangle-fill me-1"></i>เกิดข้อผิดพลาดในการประมวลผลรูปภาพ', 'danger');
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        }

        // คลิกที่กล่อง Preview เพื่อเลือกรูป
        previewBox.addEventListener('click', function (e) {
            if (e.target.closest('#removeImageBtn')) return;
            fileInput.click();
        });

        // ลากและวางไฟล์ลงในกล่อง Preview
        previewBox.addEventListener('dragover', function (e) {
            e.preventDefault();
            this.classList.add('border-primary');
        });
        previewBox.addEventListener('dragleave', function () {
            this.classList.remove('border-primary');
        });
        previewBox.addEventListener('drop', function (e) {
            e.preventDefault();
            this.classList.remove('border-primary');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleImageFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', function () {
            if (this.files && this.files[0]) {
                handleImageFile(this.files[0]);
            }
        });

        urlInput.addEventListener('input', function () {
            const val = this.value.trim();
            if (val) {
                dataInput.value = val;
                fileInput.value = '';
                showPreview(val);
                setStatus('<i class="bi bi-check-circle-fill me-1"></i>ใช้งานรูปภาพจากลิงก์ URL', 'success');
            } else {
                dataInput.value = '';
                showPreview('');
                setStatus('* รองรับภาพจากเครื่อง (JPG/PNG) หรือภาพจากเว็บ', 'muted');
            }
        });

        // ปุ่มทดลองใส่ภาพตัวอย่าง
        const sampleImages = [
            'https://images.unsplash.com/photo-1569058242253-92a9c755a0ec?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=800&q=80'
        ];
        sampleBtn.addEventListener('click', function () {
            const randomSample = sampleImages[Math.floor(Math.random() * sampleImages.length)];
            urlInput.value = randomSample;
            dataInput.value = randomSample;
            fileInput.value = '';
            showPreview(randomSample);
            setStatus('<i class="bi bi-check-circle-fill me-1"></i>ใส่รูปภาพตัวอย่างอาหารสำเร็จ พร้อมบันทึก', 'success');
        });

        removeImgBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            dataInput.value = '';
            urlInput.value = '';
            fileInput.value = '';
            showPreview('');
            setStatus('* ลบรูปภาพแล้ว (สูตรนี้จะใช้ไอคอนประจำหมวดแทน)', 'muted');
        });

        // โหลดรูปภาพเดิมที่มีอยู่ (ตรวจสอบความถูกต้อง)
        const currentValidImg = KitchenData.getImageUrl(recipe.image);
        if (currentValidImg) {
            dataInput.value = recipe.image;
            showPreview(currentValidImg);
            if (currentValidImg.startsWith('http://') || currentValidImg.startsWith('https://')) {
                urlInput.value = currentValidImg;
            }
            setStatus('<i class="bi bi-image me-1"></i>มีรูปภาพเดิมอยู่ในระบบแล้ว', 'info');
        } else {
            dataInput.value = '';
            showPreview('');
            setStatus('* ยังไม่มีรูปภาพ สามารถเลือกไฟล์หรือใส่ URL ได้', 'muted');
        }

        const recipeIngIds = (recipe.ingredients || []).map(i => parseInt(i.ingredient_id));
        const ingredients = KitchenData.getIngredients();
        const ingContainer = document.getElementById('ingredientsSelectContainer');
        ingContainer.innerHTML = ingredients.map(ing => {
            const isChecked = recipeIngIds.includes(ing.id);
            return `
            <div class="col-md-4 col-sm-6">
                <div class="form-check p-2 rounded bg-white border">
                    <input class="form-check-input ing-cb" type="checkbox" value="${ing.id}" id="edit_ing_${ing.id}" data-name="${ing.name}" data-group="${ing.category_group}" data-type="${ing.type}" ${isChecked ? 'checked' : ''}>
                    <label class="form-check-label small d-block" for="edit_ing_${ing.id}">
                        <strong>${ing.name}</strong> <span class="text-muted">(${ing.category_group})</span>
                    </label>
                </div>
            </div>`;
        }).join('');

        document.getElementById('editRecipeForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const curRecipes = KitchenData.getRecipes();
            const idx = curRecipes.findIndex(r => r.id === recipeId);
            if (idx === -1) return;

            const selectedIngs = [];
            document.querySelectorAll('.ing-cb:checked').forEach(cb => {
                const existing = (recipe.ingredients || []).find(i => parseInt(i.ingredient_id) === parseInt(cb.value));
                selectedIngs.push({
                    ingredient_id: parseInt(cb.value),
                    name: cb.getAttribute('data-name'),
                    category_group: cb.getAttribute('data-group'),
                    type: cb.getAttribute('data-type'),
                    quantity: existing ? existing.quantity : 'พอประมาณ',
                    unit: existing ? existing.unit : '',
                    is_essential: cb.getAttribute('data-type') === 'main' ? 1 : 0
                });
            });

            curRecipes[idx] = {
                ...curRecipes[idx],
                title: document.getElementById('recipeTitle').value.trim(),
                category_id: parseInt(document.getElementById('recipeCategory').value),
                description: document.getElementById('recipeDesc').value.trim(),
                cooking_time: parseInt(document.getElementById('recipeCookingTime').value) || 15,
                servings: parseInt(document.getElementById('recipeServings').value) || 1,
                image: dataInput.value.trim() || '',
                instructions: document.getElementById('recipeInstructions').value.trim(),
                ingredients: selectedIngs
            };

            try {
                localStorage.setItem('kitchen_recipes', JSON.stringify(curRecipes));
                alert('บันทึกการแก้ไขเรียบร้อยแล้ว!');
                window.location.href = '/admin/recipes.html';
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message);
            }
        });
    });
    </script>
</body>
</html>
