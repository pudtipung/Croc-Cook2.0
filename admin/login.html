<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบผู้ดูแลระบบ | มีอะไรในครัว? (What's in My Kitchen)</title>
    
    <!-- Google Fonts (Prompt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
    body {
        background: radial-gradient(circle at top right, #fff4ee 0%, var(--bg-cream) 70%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }
    .admin-login-card {
        background-color: #ffffff;
        border: 1.5px solid var(--border-subtle);
        border-radius: 24px;
        box-shadow: 0 15px 35px rgba(224, 93, 38, 0.1);
        width: 100%;
        max-width: 440px;
        overflow: hidden;
    }
    .admin-login-header {
        background: linear-gradient(135deg, #fff7f2 0%, #ffede2 100%);
        border-bottom: 1px solid var(--border-subtle);
        padding: 2.5rem 2rem 1.75rem;
        text-align: center;
    }
    .admin-avatar-box {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #ffffff;
        color: var(--primary-color);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        box-shadow: 0 6px 18px rgba(224, 93, 38, 0.18);
        margin-bottom: 1rem;
    }
    .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.25rem rgba(224, 93, 38, 0.15);
    }
    </style>
</head>
<body>

    <div class="admin-login-card">
        
        <!-- Header ส่วนหัวของฟอร์ม Login -->
        <div class="admin-login-header">
            <div class="admin-avatar-box">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h1 class="h4 fw-bold text-dark mb-1">เข้าสู่ระบบผู้ดูแลระบบ</h1>
            <p class="text-muted small mb-0">ระบบจัดการหลังบ้าน “มีอะไรในครัว?”</p>
        </div>

        <!-- Body ส่วนเนื้อหาและช่องกรอกข้อมูล -->
        <div class="p-4 p-md-4">

            <!-- แจ้งเตือนข้อผิดพลาด -->
            <div id="loginAlert" class="alert alert-danger border-0 rounded-3 py-2 px-3 d-flex align-items-center mb-3 small" style="display: none;" role="alert">
                <i class="bi bi-exclamation-circle-fill fs-5 me-2 flex-shrink-0"></i>
                <div id="loginAlertMsg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
            </div>

            <!-- ฟอร์มเข้าสู่ระบบ -->
            <form id="adminLoginForm" autocomplete="off">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-dark">
                        <i class="bi bi-person me-1 text-primary"></i> ชื่อผู้ใช้ (Username)
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" 
                               name="username" 
                               id="username" 
                               class="form-control border-start-0" 
                               placeholder="admin" 
                               value="admin"
                               required 
                               autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-dark">
                        <i class="bi bi-key me-1 text-primary"></i> รหัสผ่าน (Password)
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" 
                               name="password" 
                               id="password" 
                               class="form-control border-start-0 border-end-0" 
                               placeholder="admin123" 
                               value="admin123"
                               required>
                        <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" 
                                type="button" 
                                id="togglePasswordBtn" 
                                title="แสดง/ซ่อนรหัสผ่าน">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="form-text small text-muted">
                        บัญชีเริ่มต้น: <strong>admin</strong> / รหัสผ่าน: <strong>admin123</strong>
                    </div>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn btn-kitchen-primary w-100 py-2 rounded-pill fw-semibold shadow-xs">
                        <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
                    </button>
                </div>
            </form>

            <div class="text-center pt-3 border-top">
                <a href="/index.html" class="text-decoration-none small text-muted hover-primary">
                    <i class="bi bi-arrow-left me-1"></i> กลับสู่หน้าหลักเว็บไซต์
                </a>
            </div>

        </div>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        const loginForm = document.getElementById('adminLoginForm');
        const alertBox = document.getElementById('loginAlert');
        const alertMsg = document.getElementById('loginAlertMsg');

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener('click', function () {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.classList.remove('bi-eye');
                    toggleIcon.classList.add('bi-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.classList.remove('bi-eye-slash');
                    toggleIcon.classList.add('bi-eye');
                }
            });
        }

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            if (u === 'admin' && p === 'admin123') {
                localStorage.setItem('admin_logged_in', 'true');
                localStorage.setItem('admin_name', 'ผู้ดูแลระบบ');
                localStorage.setItem('admin_username', 'admin');
                sessionStorage.setItem('admin_logged_in', 'true');
                sessionStorage.setItem('admin_name', 'ผู้ดูแลระบบ');
                sessionStorage.setItem('admin_username', 'admin');
                window.location.href = '/admin/index.html';
            } else {
                alertBox.style.display = 'flex';
                alertMsg.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (กรุณาใช้ admin / admin123)';
            }
        });
    });
    </script>

</body>
</html>
